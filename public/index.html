<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16365f" />
    <title>NOC, TC3-TCR</title>
    <link rel="stylesheet" href="/styles.css?v=noc-wall-9" />
  </head>
  <body>
    <main class="dashboard" aria-live="polite">
      <header id="topbar" class="topbar">
        <section class="brand" data-slot="brand" aria-label="Titre du tableau de bord">
          <span class="logo-frame">
            <img class="marsa-logo" src="/assets/marsa-maroc-logo-source.png" alt="Marsa Maroc" />
          </span>
          <div class="brand-copy">
            <p id="eyebrow" class="eyebrow">CENTRE D'OPERATIONS RESEAU</p>
            <h1 id="dashboard-title">NOC, TC3-TCR</h1>
          </div>
        </section>
        <section class="summary" data-slot="summary" aria-label="Nombre de pannes">
          <span class="summary-label">Equipements injoignables</span>
          <strong id="problem-count">--</strong>
        </section>
        <section class="connection" data-slot="connection" aria-label="Etat de la connexion">
          <span id="connection-dot" class="dot"></span>
          <span id="connection-text">Connexion au service...</span>
        </section>
      </header>

      <section id="content" class="content" aria-label="Liste des pannes ICMP">
        <div class="loading">Actualisation des alertes...</div>
      </section>

      <footer id="footer" class="footer">
        <span id="scope" data-slot="scope">Groupes : Switches, AP</span>
        <span id="updated-at" data-slot="updatedAt">Mise a jour : --</span>
        <span id="clock" data-slot="clock">--:--</span>
      </footer>
    </main>
    <script src="/app.js?v=noc-wall-9"></script>
  </body>
</html>
