<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071115" />
    <title>Latence ICMP</title>
    <link rel="stylesheet" href="/latency.css?v=noc-latency-1" />
  </head>
  <body>
    <main class="latency-dashboard" aria-live="polite">
      <header class="topbar">
        <section class="brand">
          <p id="eyebrow" class="eyebrow">NOC · Zabbix · performance reseau</p>
          <h1 id="dashboard-title">Latence ICMP</h1>
        </section>
        <section class="summary">
          <span class="summary-label">Latence moyenne globale</span>
          <strong id="global-average">--</strong>
        </section>
        <section class="connection">
          <span id="connection-dot" class="dot"></span>
          <span id="connection-text">Lecture de Zabbix...</span>
        </section>
      </header>

      <section id="content" class="content" aria-label="Latence ICMP par groupe">
        <div class="loading">Lecture des mesures de latence...</div>
      </section>

      <footer class="footer">
        <span id="scope">Groupes : --</span>
        <span id="updated-at">Mise a jour : --</span>
        <span id="clock">--:--</span>
      </footer>
    </main>
    <script src="/latency.js?v=noc-latency-1"></script>
  </body>
</html>
